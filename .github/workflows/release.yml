name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build verified installation archive
        run: |
          tar -czf maplens.tar.gz package.json package-lock.json server.js install.sh dev.sh README.md CHANGELOG.json LICENSE src public scripts deploy
          sha256sum maplens.tar.gz > maplens.tar.gz.sha256
          node scripts/release-notes.js "$GITHUB_REF_NAME" > RELEASE_NOTES.md
      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" maplens.tar.gz maplens.tar.gz.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" maplens.tar.gz maplens.tar.gz.sha256 --notes-file RELEASE_NOTES.md --verify-tag
          fi
