name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenen Release-Tag veröffentlichen oder reparieren"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build verified installation archive
        run: |
          tar -czf maplens.tar.gz package.json package-lock.json server.js install.sh dev.sh README.md CHANGELOG.json LICENSE src public scripts deploy
          sha256sum maplens.tar.gz > maplens.tar.gz.sha256
          node scripts/release-notes.js "$RELEASE_TAG" > RELEASE_NOTES.md
      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" maplens.tar.gz maplens.tar.gz.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" maplens.tar.gz maplens.tar.gz.sha256 --notes-file RELEASE_NOTES.md --verify-tag
          fi
